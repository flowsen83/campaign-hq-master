const frame=document.getElementById('campaignFrame'),home=document.getElementById('home'),back=document.getElementById('homeButton');let selected=null;
function selectCampaign(key){if(!sources[key])return;selected=key;home.classList.add('hidden');back.classList.remove('hidden');frame.style.display='block';frame.srcdoc=new TextDecoder("utf-8").decode(Uint8Array.from(atob(sources[key]),c=>c.charCodeAt(0)));window.scrollTo(0,0);}
function goHome(){selected=null;frame.removeAttribute('srcdoc');frame.style.display='none';back.classList.add('hidden');home.classList.remove('hidden');window.scrollTo(0,0);}
for(const b of document.querySelectorAll('[data-campaign]'))b.addEventListener('click',()=>selectCampaign(b.dataset.campaign));back.addEventListener('click',goHome);
</script></body></html>
